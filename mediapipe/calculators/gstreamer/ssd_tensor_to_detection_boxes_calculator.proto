syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Example:
//
// node {
//   calculator: "SsdTensorToDetectionBoxesCalculator"
//   input_stream: "TENSORS:output_tensors"
//   output_stream: "DETECTION_BOXES:boxes"
//   node_options: {
//     [type.googleapis.com/mediapipe.SsdTensorToDetectionBoxesCalculatorOptions] {
//       confidence_threshold: 0.5
//       output_width: 1920
//       output_height: 1080
//     }
//   }
// }
message SsdTensorToDetectionBoxesCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional SsdTensorToDetectionBoxesCalculatorOptions ext = 113344558;
  }

  // Detections with a lower confidence are dropped.
  optional float confidence_threshold = 1 [default = 0.5];

  // Size of the frame the boxes refer to; normalized coordinates are scaled
  // by it. Overridden by the WIDTH/HEIGHT input side packets.
  optional int32 output_width = 2;
  optional int32 output_height = 3;
}
