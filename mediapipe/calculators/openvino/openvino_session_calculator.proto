syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Example:
//
// node {
//   calculator: "OpenVINOSessionCalculator"
//   output_side_packet: "SESSION:session"
//   node_options: {
//     [type.googleapis.com/mediapipe.OpenVINOSessionCalculatorOptions] {
//       model_path: "/models/resnet50/resnet50.xml"
//       device: "CPU"
//       plugin_config { key: "PERFORMANCE_HINT" value: "THROUGHPUT" }
//     }
//   }
// }
message OpenVINOSessionCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional OpenVINOSessionCalculatorOptions ext = 113344556;
  }

  message PluginConfigEntry {
    optional string key = 1;
    optional string value = 2;
  }

  // Path to the model. Either an OpenVINO IR .xml file or any other format
  // supported by ov::Core::compile_model (.onnx, saved_model.pb, .tflite...).
  optional string model_path = 1;

  // Target device, e.g. "CPU", "GPU", "NPU", "AUTO:GPU,CPU", "MULTI:CPU,GPU".
  optional string device = 2 [default = "CPU"];

  // Device configuration passed verbatim to ov::Core::compile_model.
  repeated PluginConfigEntry plugin_config = 3;

  // Number of inference requests kept in the shared queue. When unset or 0,
  // the value reported by ov::optimal_number_of_infer_requests is used.
  optional uint32 num_infer_requests = 4;
}
