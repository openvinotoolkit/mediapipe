syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Example:
//
// node {
//   calculator: "OpenVINOSessionCalculator"
//   output_side_packet: "SESSION:session"
//   node_options: {
//     [type.googleapis.com/mediapipe.OpenVINOSessionCalculatorOptions] {
//       model_path: "/models/resnet50/resnet50.xml"
//       device: "CPU"
//       plugin_config { key: "PERFORMANCE_HINT" value: "THROUGHPUT" }
//     }
//   }
// }
message OpenVINOSessionCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional OpenVINOSessionCalculatorOptions ext = 113344556;
  }

  message PluginConfigEntry {
    optional string key = 1;
    optional string value = 2;
  }

  // Path to the model. Either an OpenVINO IR .xml file or any other format
  // supported by ov::Core::compile_model (.onnx, saved_model.pb, .tflite...).
  optional string model_path = 1;

  // Target device, e.g. "CPU", "GPU", "NPU", "AUTO:GPU,CPU", "MULTI:CPU,GPU".
  optional string device = 2 [default = "CPU"];

  // Device configuration passed verbatim to ov::Core::compile_model.
  repeated PluginConfigEntry plugin_config = 3;

  // Number of inference requests kept in the shared queue. When unset or 0,
  // the value reported by ov::optimal_number_of_infer_requests is used.
  optional uint32 num_infer_requests = 4;

  // Model input shape: "auto", "(1,3,224,224)", or a JSON object mapping
  // input names to shapes. Takes precedence over batch_size.
  optional string shape = 5;

  // Model batch size as a positive integer or "auto".
  optional string batch_size = 6;

  // Tensor/model layout, e.g. "NHWC:NCHW", or a JSON object mapping input or
  // output names to layouts.
  optional string layout = 7;

  // Scalar or per-channel values subtracted from input data.
  optional string mean = 8;

  // Scalar or per-channel values used to divide input data.
  optional string scale = 9;

  // Tensor/model color format, e.g. "RGB:BGR".
  optional string color_format = 10;

  // Tensor/model element type, e.g. "uint8:fp32".
  optional string precision = 11;

  // GPU device sharing for zero-copy video frames. Requires a GPU device and
  // a build with --config=gst. When the DEVICE input side packet is absent
  // the calculator creates (and shares between sessions) its own VADisplay or
  // ID3D11Device. With color_format "NV12_2:...", the model input accepts
  // GPU surfaces, bound as "<input>/y" and "<input>/uv".
  enum RemoteContext {
    NONE = 0;
    VA = 1;     // Linux VA-API.
    D3D11 = 2;  // Windows Direct3D 11.
  }
  optional RemoteContext remote_context = 12 [default = NONE];

  // DRM render node used to create the VADisplay for remote_context VA.
  optional string va_render_node = 13 [default = "/dev/dri/renderD128"];
}
