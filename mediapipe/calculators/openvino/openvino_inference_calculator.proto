syntax = "proto2";

package mediapipe;

import "mediapipe/framework/calculator.proto";

// Example:
//
// node {
//   calculator: "OpenVINOInferenceCalculator"
//   input_side_packet: "SESSION:session"
//   input_stream: "TENSORS:input_tensors"
//   output_stream: "TENSORS:output_tensors"
// }
message OpenVINOInferenceCalculatorOptions {
  extend mediapipe.CalculatorOptions {
    optional OpenVINOInferenceCalculatorOptions ext = 113344557;
  }

  // Optional explicit mapping of the incoming tensor vector onto model inputs.
  // When empty, the i-th tensor of the input vector is bound to the i-th model
  // input.
  repeated string input_order = 1;

  // Optional explicit ordering of the produced tensor vector. When empty, the
  // outputs are emitted in model output order.
  repeated string output_order = 2;
}
